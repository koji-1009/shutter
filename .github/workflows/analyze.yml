name: Analyze

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: dart pub get
      - run: dart analyze

  format:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart run dapper --set-exit-if-changed .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: dart pub get
      - run: dart pub run coverage:test_with_coverage
      # 100% line coverage is a stated requirement (AGENTS.md); enforce it
      # here instead of relying on the codecov app's relative default.
      - name: Enforce 100% line coverage
        run: |
          uncovered=$(grep '^DA:' coverage/lcov.info | grep -c ',0$' || true)
          if [ "$uncovered" -ne 0 ]; then
            echo "::error::$uncovered uncovered line(s) in lib/ — 100% line coverage is required."
            awk -F'[:,]' '/^SF:/ { file = $2 } /^DA:/ { if ($3 == 0) print file ":" $2 }' coverage/lcov.info
            exit 1
          fi
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  publish-dry-run:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: dart pub get
      - run: dart pub publish --dry-run

  e2e:
    name: e2e (real Flutter against example/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: dart pub get
      - run: dart test -P e2e
