name: shutter
description: >-
  Renders any Flutter widget to PNG, from a command-line expression or the project's `@Preview` functions, and diffs two runs pixel-wise. A small CLI shaped for AI agents.
version: 0.1.0
repository: https://github.com/koji-1009/shutter
issue_tracker: https://github.com/koji-1009/shutter/issues
topics:
  - flutter
  - preview
  - screenshot
  - visual-diff
  - ai

environment:
  sdk: ^3.13.0

executables:
  shutter:

dependencies:
  analyzer: ^14.0.0
  args: ^2.7.0
  crypto: ^3.0.0
  image: ^4.3.0
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.1
  build_version: ^2.1.3
  coverage: ^1.15.0
  dapper: ^1.5.0
  lints: ^6.0.0
  test: ^1.32.0
  test_process: ^2.1.1
